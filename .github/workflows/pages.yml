name: Pages API

on:
  schedule:
    - cron: "17 3 * * *" # täglich ~05:17 MESZ / 04:17 MEZ
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  # Läuft auf dem Homeserver (self-hosted Runner): scrapt kaufda, normalisiert die Texte mit dem
  # lokalen Ollama-Modell (Cache unter ~/.cache/angebote) und baut die statische API.
  build:
    needs: test
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 180
    permissions:
      contents: write # NBA-Verlauf in den Branch nba-data schreiben
    env:
      NBA_DATA: ${{ runner.temp }}/nba-data
    steps:
      - uses: actions/checkout@v7
      # NBA-Verletzungs-Report (nba/build.py): täglich frische Daten von ESPN; Verlauf und letzter
      # Stand liegen im Branch nba-data. Schlägt der Abruf fehl, wird der letzte Stand deployt –
      # die Händler-API ist davon nie betroffen.
      - name: NBA-Daten aktualisieren
        continue-on-error: true
        run: |
          git worktree prune
          rm -rf "$NBA_DATA"
          if git ls-remote --exit-code --heads origin nba-data >/dev/null; then
            git fetch --depth=1 origin nba-data
            git worktree add --detach "$NBA_DATA" FETCH_HEAD
          else
            [ $? -eq 2 ] || exit 1 # 2 = Branch existiert noch nicht -> beim ersten Lauf anlegen
            git worktree add --detach "$NBA_DATA" HEAD
            git -C "$NBA_DATA" checkout -q --orphan nba-data-init
            git -C "$NBA_DATA" rm -rfq .
          fi
          python3 nba/build.py update --data-dir "$NBA_DATA"
          cd "$NBA_DATA"
          git add data.json history.json
          git -c user.name="github-actions[bot]" -c user.email="41898708+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "NBA-Daten $(date -u +%F)" || exit 0
          git push origin HEAD:nba-data
      - run: python3 -m lidl_angebote.site --out _site --normalize
      - name: NBA-Seite bauen
        run: |
          if [ -f "$NBA_DATA/data.json" ]; then src="$NBA_DATA"; else src=nba; fi
          python3 nba/build.py site --data-dir "$src" --out _site/nba
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
