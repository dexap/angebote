name: Pages API

on:
  schedule:
    - cron: "17 3 * * *" # täglich ~05:17 MESZ / 04:17 MEZ
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  # Läuft auf dem Homeserver (self-hosted Runner): scrapt kaufda, normalisiert die Texte mit dem
  # lokalen Ollama-Modell (Cache unter ~/.cache/angebote) und baut die statische API.
  build:
    needs: test
    runs-on: [self-hosted, homeserver]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m lidl_angebote.site --out _site --normalize
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
