[project]
name = "lidl-angebote"
version = "0.1.0"
description = "Aktuelle Lidl-Lebensmittelangebote der Woche von kaufda.de als JSON"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lidl-angebote = "lidl_angebote.cli:main"

[tool.setuptools]
packages = ["lidl_angebote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
